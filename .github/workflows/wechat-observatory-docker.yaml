# Build the WeChat Observatory gateway image from Gitea and push to Gitea.
# Triggered by the Gitea repo writing the tagged commit SHA to
# wechat-observatory/trigger.txt.
name: Build WeChat Observatory Gateway & Push to Gitea

on:
  push:
    paths:
      - 'wechat-observatory/trigger.txt'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (like v0.0.1). Defaults to the tag at the triggered commit.'
        required: false
        type: string

env:
  GITEA_REPO: wechat-observatory

jobs:
  # ── Job 1: Resolve which commit and tag to build ───────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout build repo (for the trigger file)
        uses: actions/checkout@v4
        with:
          path: trigger

      - name: Clone Gitea repository (full history for tag lookup)
        run: |
          git clone --no-single-branch \
            "https://${{ secrets.GITEA_USERNAME }}:${{ secrets.GITEA_CODE_PAT }}@${{ secrets.GITEA_HOST }}/${{ secrets.GITEA_USERNAME }}/${GITEA_REPO}.git" src
          cd src && git fetch --tags --force

      - name: Resolve commit and tag
        id: resolve
        working-directory: src
        run: |
          set -euo pipefail
          MANUAL="${{ github.event.inputs.tag }}"
          if [ -n "$MANUAL" ]; then
            TAG="$MANUAL"
            SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          else
            SHA=$(tr -d '[:space:]' < ../trigger/wechat-observatory/trigger.txt)
            [ -n "$SHA" ] || { echo "wechat-observatory/trigger.txt is empty"; exit 1; }
            # Prefer a tag pointing exactly at the triggered commit; fall back to
            # the nearest ancestor tag. 'lsposed-v*' is excluded because those
            # tag the Android module, not the gateway.
            TAG=$(git tag --points-at "$SHA" --sort=-v:refname | grep '^v' | head -1 || true)
            [ -n "$TAG" ] || TAG=$(git describe --tags --abbrev=0 --match 'v*' "$SHA")
          fi
          echo "Building ${SHA} as ${TAG}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ── Job 2: Build & push per-architecture images ────────────────────
  build-and-push:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Clone Gitea repository and check out the triggered commit
        run: |
          git clone \
            "https://${{ secrets.GITEA_USERNAME }}:${{ secrets.GITEA_CODE_PAT }}@${{ secrets.GITEA_HOST }}/${{ secrets.GITEA_USERNAME }}/${GITEA_REPO}.git" .
          git fetch --tags --force
          git checkout --detach "${{ needs.prepare.outputs.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GITEA_HOST }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_REGISTRY_PAT }}

      # No QEMU: each architecture builds on its own native runner. The web and
      # Go stages are pinned to BUILDPLATFORM and cross-compile via TARGETARCH,
      # so only the small final alpine stage is architecture-specific.
      # GOPROXY is overridden because the Dockerfile defaults to goproxy.cn,
      # which is the slow path from GitHub-hosted runners.
      - name: Build and push (attempt 1)
        id: buildx1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ${{ secrets.GITEA_HOST }}/${{ secrets.GITEA_USERNAME }}/wechat-observatory:${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=wechat-observatory-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wechat-observatory-${{ matrix.arch }}

      - name: Wait before retry
        if: steps.buildx1.outcome != 'success'
        run: sleep 30

      - name: Build and push (retry)
        if: steps.buildx1.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ${{ secrets.GITEA_HOST }}/${{ secrets.GITEA_USERNAME }}/wechat-observatory:${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=wechat-observatory-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wechat-observatory-${{ matrix.arch }}

  # ── Job 3: Merge multi-arch manifests ──────────────────────────────
  merge-manifest:
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GITEA_HOST }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_REGISTRY_PAT }}

      - name: Create and push manifest list
        run: |
          set -e
          VERSION_TAG="${{ needs.prepare.outputs.tag }}"
          IMAGE_BASE="${{ secrets.GITEA_HOST }}/${{ secrets.GITEA_USERNAME }}/wechat-observatory"

          AMD64="${IMAGE_BASE}:amd64-${VERSION_TAG}"
          ARM64="${IMAGE_BASE}:arm64-${VERSION_TAG}"

          # Both must exist: publishing a half manifest would silently give
          # one architecture a working image and the other a missing one.
          docker manifest inspect "${AMD64}" >/dev/null
          docker manifest inspect "${ARM64}" >/dev/null

          for TAG in "${VERSION_TAG}" latest; do
            TARGET="${IMAGE_BASE}:${TAG}"
            docker manifest rm "${TARGET}" 2>/dev/null || true
            docker manifest create "${TARGET}" --amend "${AMD64}" --amend "${ARM64}"
            docker manifest push "${TARGET}"
            echo "Pushed ${TARGET}"
          done

      - name: Inspect final manifest
        run: |
          docker manifest inspect "${{ secrets.GITEA_HOST }}/${{ secrets.GITEA_USERNAME }}/wechat-observatory:latest"
